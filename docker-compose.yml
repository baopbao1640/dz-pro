services:
  postgres:
    image: postgres:15
    container_name: platform-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_admin}
      POSTGRES_DB: platform_core
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_core"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: platform-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: platform-keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SPI_THEME_DEFAULT_LOCALE: zh-CN
      KC_SPI_LOGIN_THEME_LOCALE: zh-CN
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://platform-postgres:5432/platform_core
      KC_DB_USERNAME: platform_admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-platform_admin}
    command: ["start-dev"]
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:
